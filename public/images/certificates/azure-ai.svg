<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a192f"/>
      <stop offset="50%" stop-color="#002b49"/>
      <stop offset="100%" stop-color="#001424"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00a4ef" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0078d4" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="400" height="250" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>

  <!-- Decorative Glow Circle -->
  <circle cx="340" cy="60" r="80" fill="#0078d4" opacity="0.15" filter="url(#glow)"/>

  <!-- Microsoft 4-Color Squares -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="14" height="14" fill="#f25022"/>
    <rect x="17" y="0" width="14" height="14" fill="#7fba00"/>
    <rect x="0" y="17" width="14" height="14" fill="#00a4ef"/>
    <rect x="17" y="17" width="14" height="14" fill="#ffb900"/>
    <text x="42" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="0.5">Microsoft</text>
  </g>

  <!-- Certified Ribbon / Badge Tag -->
  <g transform="translate(30, 85)">
    <rect x="0" y="0" width="155" height="24" rx="12" fill="rgba(0, 164, 239, 0.15)" stroke="#00a4ef" stroke-width="1"/>
    <text x="77" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#00d4ff" text-anchor="middle" letter-spacing="0.5">CERTIFIED CREDENTIAL</text>
  </g>

  <!-- Certificate Title -->
  <text x="30" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="19" font-weight="700" fill="#ffffff">Azure AI Fundamentals</text>
  <text x="30" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#8bb4d9">Machine Learning • Neural Networks • Computer Vision</text>

  <!-- Verification Badge & Date -->
  <g transform="translate(30, 195)">
    <!-- Checkmark icon circle -->
    <circle cx="10" cy="10" r="10" fill="#00a4ef" opacity="0.2"/>
    <circle cx="10" cy="10" r="7" fill="#00a4ef"/>
    <path d="M7 10 L9 12 L13 8" stroke="#ffffff" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="28" y="14" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00e5ff">Verified Microsoft Certification</text>
  </g>

  <text x="370" y="209" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500" fill="#6c8ea4" text-anchor="end">Apr 2026</text>
</svg>
