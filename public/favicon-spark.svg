<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="bgBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep dark container -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="#070913" stroke="url(#bgBorder)" stroke-width="2.5"/>

  <!-- AI 4-Point Neural Spark (Gemini / Agent style) -->
  <path d="M32 12 C32 23 23 32 12 32 C23 32 32 41 32 52 C32 41 41 32 52 32 C41 32 32 23 32 12 Z" 
        fill="url(#sparkGrad)" filter="url(#glow)"/>

  <!-- Core Bright Center Node -->
  <circle cx="32" cy="32" r="3.5" fill="#ffffff"/>
  
  <!-- Mini Satellite Agent Nodes -->
  <circle cx="17" cy="17" r="2" fill="#00f2fe" opacity="0.85"/>
  <circle cx="47" cy="17" r="2.5" fill="#8b5cf6" opacity="0.85"/>
  <circle cx="47" cy="47" r="2" fill="#00f2fe" opacity="0.85"/>
</svg>
